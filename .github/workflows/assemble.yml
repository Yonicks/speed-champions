name: Assemble Speed Champions HTML

on:
  push:
    branches: [main]
    paths:
      - '.transport/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait until upload is complete
        id: ready
        shell: bash
        run: |
          if [ -f .transport/READY ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble and validate index.html
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          cat .transport/part-*.b64 | base64 --decode > index.html
          test -s index.html
          grep -qi '<!doctype html>' index.html
          grep -q 'Speed Champions V272' index.html
          grep -q 'START V272' index.html
          rm -rf .transport

      - name: Commit assembled game
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish Speed Champions V272 HTML'
          git push origin main
